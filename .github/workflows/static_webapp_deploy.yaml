name: webapp-deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose Deployment environment'
        required: true
        type: choice
        options:
          - test

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Azure Login
        shell: bash
        run: |
          az login --identity --client-id "${{ secrets.AZURE_CLIENT_ID }}"
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Verify Azure Login
        run: |
          az account show -o table
           
      - name: Get Static Web App Deployment Token
        shell: bash
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          RG: ${{ vars.TEST_RG }}
          SWA_NAME: swa-api-${{ github.event.inputs.environment }}-eus2-01
        run: |
          echo "Selected Environment: $ENVIRONMENT"
          echo "SWA: $SWA_NAME"
          echo "Resource Group: $RG"

          TOKEN=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$RG" \
            --query "properties.apiKey" \
            --output tsv)

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to retrieve SWA deployment token"
            exit 1
          fi

          # echo "::add-mask::$TOKEN"
          # echo "SWA deployment token retrieved successfully"
          
          echo "SWA Deployment Token: $TOKEN"
          echo "AZURE_STATIC_WEB_APPS_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

